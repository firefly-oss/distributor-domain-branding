openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:18080
  description: Generated server url
tags:
- name: Terms and Conditions
  description: Lifecycle operations for distributor terms and conditions
- name: Territory
  description: CRUD operations for distributor authorized territories
- name: Agent
  description: CRUD operations for distributor agents
- name: Distributor
  description: CQ queries and registration for Distributors
- name: Operation
  description: Lifecycle operations for distributor operations
- name: Agent-Agency
  description: Operations for distributor agent-agency assignments
- name: Agency
  description: CRUD operations for distributor agencies
- name: Distributor Query
  description: Query endpoints for distributor profile and branding
- name: Configuration
  description: CRUD operations for distributor configurations
paths:
