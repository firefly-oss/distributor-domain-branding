                format: uuid
    delete:
      tags:
      - Territory
      summary: Delete Territory
      description: Delete an authorized territory from a distributor.
      operationId: deleteTerritory
      parameters:
      - name: distributorId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: territoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
