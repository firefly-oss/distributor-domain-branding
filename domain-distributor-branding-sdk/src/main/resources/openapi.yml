        required: true
        schema:
          type: string
          format: uuid
      - name: territoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DistributorAuthorizedTerritoryDTO"
    put:
      tags:
      - Territory
      summary: Update Territory
      description: Update an existing authorized territory.
      operationId: updateTerritory
      parameters:
